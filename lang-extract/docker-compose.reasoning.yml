services:
  petta-reasoner:
    build:
      context: .
      dockerfile: src/langextract_atomspace/petta_reasoner_service/Dockerfile
    ports:
      - "8010:8010"
    environment:
      - PETTA_ATOMSPACE_PATH=/app/data/atomspace/kb.metta
    volumes:
      - petta_reasoner_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  petta_reasoner_data:
